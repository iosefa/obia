name: Tests

on:
  pull_request:
    paths:
      - "obia/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "obia/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            profile: core
            extras: test
            constraints: ""
          - python-version: "3.12"
            profile: latest
            extras: test,xgboost,explain
            constraints: ""
          - python-version: "3.11"
            profile: minimum
            extras: test,xgboost,explain
            constraints: "scikit-learn==1.4.2 xgboost==2.1.4 shap==0.51.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]" ${{ matrix.constraints }}

      - name: Run tests
        run: pytest -q
