site_name: OBIA
site_url: https://obia.sefa.ai
repo_url: https://github.com/iosefa/obia

exclude_docs: |
    /examples/example_outputs/

theme:
    name: material
    palette:
        primary: green
        accent: deep-orange
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.instant
        - navigation.sections
        - search.highlight
        - search.suggest

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                options:
                    docstring_style: google
                    show_source: true
                    show_root_heading: true
                    show_symbol_type_heading: true
    - git-revision-date-localized
    - mkdocs-jupyter:
        include_source: true
        execute: false
        ignore_h1_titles: true

markdown_extensions:
    - md_in_html
    - attr_list
    - pymdownx.superfences
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

nav:
    - Home: index.md
    - Installation: installation.md
    - Concepts: concepts.md
    - Example Notebooks:
        - Getting Started: examples/index.md
        - Raster Segmentation: examples/01_segmentation.ipynb
        - Raster Object Features: examples/02_raster_features.ipynb
        - Object Classification: examples/03_classification.ipynb
        - Pixel Classification: examples/04_pixel_classification.ipynb
    - Usage:
        - Segmentation: usage/segmentation.md
        - Raster Features: usage/raster-features.md
        - Object Classification: usage/classification.md
        - Pixel Classification: usage/pixel-classification.md
        - Training and Validation: usage/validation.md
        - Point Clouds: usage/pointcloud.md
        - Large Rasters: usage/large-rasters.md
        - Experimental Detection: usage/detection.md
    - Development:
        - Contributing: contributing.md
        - Code of Conduct: code_of_conduct.md
    - Changelog: https://github.com/iosefa/obia/releases
    - Report Issues: https://github.com/iosefa/obia/issues
    - API Reference:
        - Overview: api/index.md
        - Raster Loading: api/handlers.md
        - Segmentation: api/segmentation.md
        - Raster Features: api/features.md
        - Point Clouds: api/pointcloud.md
        - Experimental Detection: api/detection.md
        - Classification: api/classification.md
        - Utils: api/utils.md

extra_javascript:
 - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js
