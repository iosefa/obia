name: Tests

on:
  pull_request:
    paths:
      - "obia/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "obia/**"
      - "tests/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -q
